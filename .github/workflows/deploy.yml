name: 部署到 Cloudflare Workers

on:
  push:
    branches: [ main ]
    paths:  # ✅ 移到push下，仅修改指定文件才触发push部署
      - 'worker.js'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # ✅ 手动触发无需paths，单独配置

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ✅ 修正if条件：允许push/手动触发，移除无效的pull_request判断
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Wrangler
        run: npm install -g wrangler

      - name: 部署到 Cloudflare Workers
        run: |
          # ✅ 补充account_id（若wrangler.toml未配置，需传递）
          wrangler deploy --var TMDB_API_KEY:"${{ secrets.TMDB_API_KEY }}" --account-id "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        env:
          # ✅ 传递API Token（Wrangler会自动读取该环境变量）
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # ✅ 可选：显式传递account_id（避免部署时找不到账户）
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
